name: QA Repository Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-artifacts:
    name: Verify QA files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate test cases and evidence
        run: python scripts/verify_repository.py
